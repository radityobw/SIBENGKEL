<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative px-margin-mobile">
<!-- Main Login Container -->
<main class="w-full max-w-sm z-10 flex flex-col gap-xl">
<!-- Branding Header -->
<header class="flex flex-col items-center justify-center gap-xs text-center w-full">
<div class="w-16 h-16 bg-primary text-on-primary rounded-xl flex items-center justify-center shadow-md mb-sm">
<span class="material-symbols-outlined text-[32px]">build</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">SIBENGKEL</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sistem Manajemen Terpadu</p>
</header>
<!-- Form Area -->
<div class="w-full">
<div class="mb-md text-center">
<h2 class="font-headline-md text-headline-md text-on-surface">Masuk ke Akun</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-base">Silakan masukkan kredensial Anda untuk melanjutkan.</p>
</div>
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Identifier Input with Error State -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="identifier">Email atau ID Mekanik</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none">
<span class="material-symbols-outlined text-error">person</span>
</div>
<input class="block w-full h-[48px] pl-10 pr-10 py-sm bg-surface-container-lowest text-on-surface border border-error rounded focus:border-error focus:ring-1 focus:ring-error font-body-md text-body-md transition-all placeholder:text-outline-variant" id="identifier" name="identifier" placeholder="admin@bengkel.com" required="" type="text" value="invalid-email"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-sm pointer-events-none">
<span class="material-symbols-outlined text-error text-[20px]">error</span>
</div>
</div>
<p class="font-label-sm text-label-sm text-error">Format email tidak valid</p>
</div>
<!-- Password Input with Toggle and Error State -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none">
<span class="material-symbols-outlined text-error">lock</span>
</div>
<input class="block w-full h-[48px] pl-10 pr-[88px] py-sm bg-surface-container-lowest text-on-surface border border-error rounded focus:border-error focus:ring-1 focus:ring-error font-body-md text-body-md transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password" value="wrongpassword"/>
<div class="absolute inset-y-0 right-0 flex items-center gap-xs pr-sm">
<span class="material-symbols-outlined text-error text-[20px] pointer-events-none">error</span>
<button aria-label="Toggle password visibility" class="flex items-center justify-center w-[44px] h-[44px] text-outline hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<p class="font-label-sm text-label-sm text-error">Kata sandi tidak sesuai</p>
</div>
<!-- Checkbox & Forgot Password -->
<div class="flex justify-between items-center w-full mt-xs">
<label class="flex items-center gap-xs cursor-pointer min-h-[44px] group">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-background bg-surface-container-lowest transition-all" id="remember" name="remember" type="checkbox"/>
<span class="font-label-md text-label-md text-on-surface group-hover:text-primary transition-colors">Ingat saya</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors min-h-[44px] flex items-center" href="#">Lupa sandi?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] mt-sm bg-primary text-on-primary rounded font-label-md text-label-md flex items-center justify-center gap-xs hover:bg-tertiary-container transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-[0.98] duration-150 shadow-sm group" type="submit">
                    Masuk
                    <span class="material-symbols-outlined text-on-primary text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Note -->
<footer class="text-center w-full mt-xl">
<p class="font-label-sm text-label-sm text-on-surface-variant min-h-[44px] flex items-center justify-center">
                Butuh bantuan akses? <a class="text-primary font-bold hover:underline ml-1" href="#">Hubungi Supervisor</a>
</p>
</footer>
