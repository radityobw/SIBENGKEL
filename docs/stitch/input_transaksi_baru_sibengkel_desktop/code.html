<!DOCTYPE html>

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col md:flex-row">
<!-- Note: TopNavBar and SideNavBar are suppressed because this is a focused, transactional "Input Form" sub-page (Destination Rule). The user is in a focused journey. -->
<!-- Top App Bar for Mobile (Basic Header to allow return) -->
<header class="md:hidden flex items-center justify-between h-16 px-margin-mobile border-b border-outline-variant bg-surface sticky top-0 z-40">
<button class="text-on-surface hover:bg-surface-container-high rounded-full p-2 -ml-2 flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">New Service</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-4xl mx-auto p-margin-mobile md:p-margin-desktop md:pt-16 pb-24 md:pb-margin-desktop">
<!-- Header -->
<div class="mb-8 hidden md:flex items-center gap-4">
<button class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest rounded-full p-2 transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-1">Input Transaksi Baru</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Catat rincian layanan atau penjualan bengkel.</p>
</div>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm overflow-hidden">
<div class="p-6 md:p-8">
<form action="#" class="space-y-8" method="POST">
<!-- Section 1: Vehicle & Customer -->
<section>
<h2 class="font-headline-md text-headline-md text-primary mb-4 flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">directions_car</span>
                            Detail Kendaraan
                        </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Vehicle Selection (Searchable) -->
<div class="col-span-1 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface mb-2" for="vehicle_select">Pilih Kendaraan <span class="text-error">*</span></label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">search</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md min-h-[44px]" id="vehicle_select" name="vehicle_select" placeholder="Cari Plat Nomor atau Nama Pemilik..." type="text"/>
<p class="mt-2 font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
                                        Ketik minimal 3 karakter untuk mencari.
                                    </p>
</div>
</div>
</div>
</section>
<hr class="border-t border-outline-variant"/>
<!-- Section 2: Service Details -->
<section>
<h2 class="font-headline-md text-headline-md text-primary mb-4 flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">build</span>
                            Informasi Layanan
                        </h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Transaction Type (Radio) -->
<div class="col-span-1 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface mb-3">Jenis Transaksi <span class="text-error">*</span></label>
<div class="flex flex-col sm:flex-row gap-4">
<label class="relative flex cursor-pointer rounded-lg border border-outline p-4 focus:outline-none w-full hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-container has-[:checked]:border-primary has-[:checked]:text-on-primary-container min-h-[44px] items-center">
<input checked="" class="sr-only" name="transaction_type" type="radio" value="servis"/>
<span class="material-symbols-outlined mr-3">home_repair_service</span>
<span class="font-label-md text-label-md flex-1">Servis / Perbaikan</span>
<span class="material-symbols-outlined opacity-0 check-icon">check_circle</span>
</label>
<label class="relative flex cursor-pointer rounded-lg border border-outline p-4 focus:outline-none w-full hover:bg-surface-container-low transition-colors has-[:checked]:bg-primary-container has-[:checked]:border-primary has-[:checked]:text-on-primary-container min-h-[44px] items-center">
<input class="sr-only" name="transaction_type" type="radio" value="penjualan"/>
<span class="material-symbols-outlined mr-3">shopping_cart</span>
<span class="font-label-md text-label-md flex-1">Penjualan Sparepart</span>
<span class="material-symbols-outlined opacity-0 check-icon">check_circle</span>
</label>
</div>
<style>
                                    input:checked ~ .check-icon { opacity: 1; }
                                </style>
</div>
<!-- Mechanic Assignment -->
<div class="col-span-1">
<label class="block font-label-md text-label-md text-on-surface mb-2" for="mechanic">Mekanik Bertugas</label>
<div class="relative">
<select class="block w-full pl-3 pr-10 py-3 border border-outline rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md appearance-none min-h-[44px]" id="mechanic" name="mechanic">
<option value="">-- Pilih Mekanik --</option>
<option value="m1">Budi Santoso</option>
<option value="m2">Agus Riyadi</option>
<option value="m3">Hendra (Junior)</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-outline">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">expand_more</span>
</div>
</div>
</div>
<!-- Transaction Date -->
<div class="col-span-1">
<label class="block font-label-md text-label-md text-on-surface mb-2" for="trans_date">Tanggal Transaksi <span class="text-error">*</span></label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md min-h-[44px]" id="trans_date" name="trans_date" type="date"/>
</div>
</div>
<!-- Description/Complaint -->
<div class="col-span-1 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface mb-2" for="description">Keluhan / Deskripsi Layanan</label>
<textarea class="block w-full p-3 border border-outline rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md" id="description" name="description" placeholder="Jelaskan keluhan pelanggan atau rincian pekerjaan yang akan dilakukan..." rows="4"></textarea>
</div>
<!-- Estimated Cost -->
<div class="col-span-1 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface mb-2" for="est_cost">Estimasi Biaya</label>
<div class="relative mt-1 rounded-md shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
<span class="text-on-surface-variant font-body-md sm:text-sm">Rp</span>
</div>
<input class="block w-full rounded-lg border border-outline pl-10 pr-12 py-3 bg-surface-container-lowest focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-right min-h-[44px]" id="est_cost" name="est_cost" placeholder="0" type="text"/>
</div>
<p class="mt-2 font-label-sm text-label-sm text-on-surface-variant">Kosongkan jika belum diketahui kepastiannya.</p>
</div>
</div>
</section>
</form>
</div>
<!-- Footer Actions -->
<div class="bg-surface-container px-6 py-4 flex flex-col-reverse sm:flex-row justify-end items-center gap-3 border-t border-outline-variant rounded-b-xl">
<button class="w-full sm:w-auto px-6 py-3 border border-outline text-on-surface bg-transparent rounded-lg font-label-md text-label-md font-semibold hover:bg-surface-container-highest transition-colors min-h-[44px]" type="button">
                    Batal
                </button>
<button class="w-full sm:w-auto px-6 py-3 bg-secondary text-on-secondary rounded-lg font-label-md text-label-md font-semibold hover:bg-[#a65a00] transition-colors shadow-sm min-h-[44px] flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined text-[18px]">save</span>
                    Simpan Transaksi
                </button>
</div>
</div>
</main>
</body></html>
