<!-- Branding Header -->

</header>

<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-lg p-md md:p-lg w-full backdrop-blur-sm bg-opacity-95">
<div class="mb-md">
<h2 class="font-headline-md text-headline-md text-on-surface">Masuk ke Akun</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-base">Silakan masukkan kredensial Anda untuk melanjutkan.</p>
</div>
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Identifier Input -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="identifier">Email atau ID Mekanik</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="block w-full h-[48px] pl-10 pr-sm py-sm bg-surface text-on-surface border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md transition-all placeholder:text-outline-variant" id="identifier" name="identifier" placeholder="admin@bengkel.com" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center w-full">
<label class="font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Lupa sandi?</a>
</div>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full h-[48px] pl-10 pr-sm py-sm bg-surface text-on-surface border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md transition-all placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>

<button class="w-full h-[48px] mt-sm bg-primary text-on-primary rounded font-label-md text-label-md flex items-center justify-center gap-xs hover:bg-tertiary-container transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary active:scale-[0.98] duration-150 shadow-sm group" type="submit">
                    Masuk
                    <span class="material-symbols-outlined text-on-primary text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
