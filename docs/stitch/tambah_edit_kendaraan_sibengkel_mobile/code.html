<style>
        body {
            -webkit-tap-highlight-color: transparent;

        /* Custom styles for select to match inputs */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top App Bar (Task-Focused: Back button, no global nav/profile) -->
<header class="docked full-width top-0 h-16 border-b border-outline-variant flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop bg-surface dark:bg-on-background sticky z-40">
<div class="flex items-center gap-sm w-full">
<button aria-label="Go back" class="h-[44px] w-[44px] flex items-center justify-center text-on-surface hover:bg-surface-container-high rounded-full transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim truncate">
                Add Vehicle
            </h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto w-full max-w-2xl mx-auto px-margin-mobile py-md flex flex-col gap-md">
<p class="font-body-md text-body-md text-on-surface-variant">Enter vehicle details to register a new unit in the workshop system.</p>
<form class="flex flex-col gap-md w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-sm md:p-md">
<!-- Owner (Searchable Select Mockup) -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="owner">Owner</label>
<div class="relative">
<select class="w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded-md px-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="owner" name="owner">
<option disabled="" selected="" value="">Select or search owner</option>
<option value="1">Budi Santoso</option>
<option value="2">PT. Lintas Logistik</option>
<option value="3">Siti Aminah</option>
</select>
</div>
</div>
<!-- Plat Nomor -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="plat_nomor">Plat Nomor</label>
<input class="w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded-md px-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors uppercase" id="plat_nomor" name="plat_nomor" placeholder="e.g. B 1234 CD" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Merk -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="merk">Merk</label>
<input class="w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded-md px-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="merk" name="merk" placeholder="e.g. Toyota" type="text"/>
</div>
<!-- Model -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="model">Model</label>
<input class="w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded-md px-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="model" name="model" placeholder="e.g. Avanza" type="text"/>
</div>
</div>
<!-- Tahun -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="tahun">Tahun</label>
<input class="w-full h-[44px] bg-surface-container-lowest border border-outline-variant rounded-md px-sm font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="tahun" max="2100" min="1900" name="tahun" placeholder="e.g. 2019" type="number"/>
</div>
</form>
</main>
<!-- Bottom Action Bar (Fixed at bottom for mobile reachability) -->
<div class="sticky bottom-0 w-full bg-surface border-t border-outline-variant p-margin-mobile mt-auto z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<button class="w-full h-[44px] bg-secondary text-on-secondary font-label-md text-label-md rounded-lg flex items-center justify-center gap-xs hover:bg-secondary-container hover:text-on-secondary-container transition-colors active:scale-[0.98]" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">save</span>
            Simpan Kendaraan
        </button>
</div>
