<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface text-primary font-headline-md docked full-width top-0 border-b border-outline-variant transition-colors duration-200 active:opacity-80 flex justify-between items-center h-16 px-margin-mobile w-full z-50">
<div class="flex items-center gap-xs">
<button aria-label="Back" class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-headline-md font-bold">Tambah Pelanggan</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow p-margin-mobile flex flex-col pb-[90px]"> <!-- Extra padding bottom for fixed button -->
<form class="flex flex-col gap-sm">
<!-- Input: Nama -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-on-surface-variant" for="nama">Nama Pelanggan <span class="text-error">*</span></label>
<input aria-describedby="nama-error" aria-invalid="true" class="min-h-touch w-full rounded bg-surface-container-lowest border border-error text-on-surface font-body-md px-sm focus:outline-none focus:ring-1 focus:ring-error focus:border-error transition-colors" id="nama" name="nama" type="text" value="John123"/>
<p class="font-label-sm text-error flex items-center gap-1 mt-1" id="nama-error">
<span class="material-symbols-outlined text-[16px]">error</span>
                    Format nama tidak sesuai
                </p>
</div>
<!-- Input: No. Telepon -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-on-surface-variant" for="telepon">No. Telepon <span class="text-error">*</span></label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant">call</span>
<input class="min-h-touch w-full rounded bg-surface-container-lowest border border-outline text-on-surface font-body-md pl-[44px] pr-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors" id="telepon" name="telepon" placeholder="Contoh: 081234567890" type="tel"/>
</div>
</div>
<!-- Input: Alamat -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-on-surface-variant" for="alamat">Alamat</label>
<textarea class="w-full rounded bg-surface-container-lowest border border-outline text-on-surface font-body-md p-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors resize-none" id="alamat" name="alamat" placeholder="Masukkan alamat lengkap..." rows="3"></textarea>
</div>
<!-- Additional Details Accordion / Section -->
<div class="mt-sm p-sm bg-surface-container-low rounded-lg border border-outline-variant">
<h3 class="font-label-md text-on-surface mb-xs flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">directions_car</span>
                    Info Kendaraan (Opsional)
                 </h3>
<p class="font-body-md text-on-surface-variant text-sm mb-xs">Tambahkan data kendaraan nanti atau sekarang untuk mempercepat proses service.</p>
<button class="font-label-md text-primary hover:underline flex items-center gap-1" type="button">
<span class="material-symbols-outlined text-[16px]">add</span> Tambah Kendaraan
                 </button>
</div>
</form>
</main>
<!-- Fixed Bottom Action Area (Task-focused page, so no generic nav shell) -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-margin-mobile z-50">
<button class="w-full min-h-touch bg-primary text-on-primary font-label-md rounded flex justify-center items-center gap-2 hover:bg-primary-container transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
            Simpan Pelanggan
        </button>
