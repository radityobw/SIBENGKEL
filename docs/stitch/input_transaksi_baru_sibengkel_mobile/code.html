<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>New Service Transaction - SIBENGKEL</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error-container": "#ffdad6",
                    "on-primary": "#ffffff",
                    "surface-variant": "#e1e2e4",
                    "outline": "#74777f",
                    "on-primary-container": "#8aa4cf",
                    "on-primary-fixed-variant": "#2d486d",
                    "inverse-on-surface": "#f0f1f3",
                    "secondary-container": "#ffa454",
                    "on-tertiary-fixed": "#001c39",
                    "surface": "#f8f9fb",
                    "primary-fixed": "#d5e3ff",
                    "surface-container-highest": "#e1e2e4",
                    "secondary-fixed-dim": "#ffb77d",
                    "secondary-fixed": "#ffdcc3",
                    "surface-bright": "#f8f9fb",
                    "on-error": "#ffffff",
                    "error": "#ba1a1a",
                    "surface-container-high": "#e7e8ea",
                    "on-tertiary-fixed-variant": "#004883",
                    "on-tertiary-container": "#62a5f9",
                    "tertiary-fixed-dim": "#a4c9ff",
                    "on-secondary-fixed": "#2f1500",
                    "on-primary-fixed": "#001c3b",
                    "on-error-container": "#93000a",
                    "inverse-surface": "#2e3132",
                    "inverse-primary": "#adc8f5",
                    "primary-container": "#1e3a5f",
                    "on-secondary-container": "#713b00",
                    "surface-container-low": "#f2f4f6",
                    "surface-container": "#edeef0",
                    "tertiary": "#002447",
                    "primary": "#022448",
                    "on-tertiary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "surface-dim": "#d9dadc",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed-variant": "#6e3900",
                    "background": "#f8f9fb",
                    "tertiary-container": "#003a6c",
                    "surface-tint": "#455f87",
                    "on-surface": "#191c1e",
                    "secondary": "#904d00",
                    "on-surface-variant": "#43474e",
                    "tertiary-fixed": "#d4e3ff",
                    "on-background": "#191c1e",
                    "primary-fixed-dim": "#adc8f5",
                    "outline-variant": "#c4c6cf"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "32px",
                    "xs": "8px",
                    "md": "24px",
                    "sm": "16px",
                    "margin-mobile": "16px",
                    "gutter": "20px",
                    "xl": "48px",
                    "margin-desktop": "32px",
                    "base": "4px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Sora"],
                    "body-md": ["Inter"],
                    "headline-md": ["Sora"],
                    "headline-lg": ["Sora"],
                    "body-lg": ["Inter"],
                    "label-sm": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-xl": ["Sora"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                    "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                    "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                    "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                    "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                    "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                    "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                    "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
            }
          }
        }
      }
    </script>
<style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #c4c6cf;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased h-screen flex flex-col md:hidden overflow-hidden">
<!-- Top Navigation (Modal Header) -->
<header class="bg-surface border-b border-outline-variant fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 shadow-sm">
<button class="w-10 h-10 flex items-center justify-center rounded-full active:bg-surface-container-high transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">New Service</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Scrollable Canvas -->
<main class="flex-1 mt-16 mb-20 overflow-y-auto custom-scrollbar bg-surface px-margin-mobile py-sm pb-xl">
<form class="space-y-md" id="new-service-form">
<!-- 1. Searchable Vehicle Selection -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="vehicle">Vehicle Selection <span class="text-error">*</span></label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full h-[44px] pl-10 pr-sm bg-surface border border-outline-variant rounded-DEFAULT font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-on-surface placeholder:text-outline-variant" id="vehicle" placeholder="Search license plate or model..." type="text"/>
</div>
<!-- Dropdown suggestions placeholder -->
<div class="hidden absolute z-10 w-[calc(100%-32px)] bg-surface border border-outline-variant rounded-DEFAULT mt-1 shadow-md max-h-[150px] overflow-y-auto">
<div class="p-xs hover:bg-surface-container-low cursor-pointer font-body-md text-body-md border-b border-outline-variant">B 1234 CD - Toyota Avanza</div>
</div>
<p class="font-label-sm text-label-sm text-error hidden" id="error-vehicle">Please select a valid vehicle.</p>
</div>
<!-- 2. Mechanic Dropdown -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="mechanic">Assigned Mechanic <span class="text-error">*</span></label>
<div class="relative">
<select class="w-full h-[44px] pl-sm pr-10 bg-surface border border-outline-variant rounded-DEFAULT font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-on-surface appearance-none" id="mechanic">
<option disabled="" selected="" value="">Select a mechanic</option>
<option value="1">Budi Santoso</option>
<option value="2">Andi Wijaya</option>
<option value="3">Joko Anwar</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-outline pointer-events-none">arrow_drop_down</span>
</div>
</div>
<!-- 3. Complaint Description -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="complaint">Complaint / Notes</label>
<textarea class="w-full p-sm bg-surface border border-outline-variant rounded-DEFAULT font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-on-surface placeholder:text-outline-variant resize-none" id="complaint" placeholder="Describe the issue reported by the customer..." rows="3"></textarea>
</div>
<!-- 6. Type Selection (Servis/Penjualan) - Moved up for better logical flow -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface">Transaction Type <span class="text-error">*</span></label>
<div class="flex gap-sm">
<label class="flex-1 relative">
<input checked="" class="peer sr-only" name="tx_type" type="radio" value="servis"/>
<div class="w-full h-[44px] flex items-center justify-center border border-outline-variant rounded-DEFAULT font-label-md text-label-md cursor-pointer peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary transition-all">
                            Servis
                        </div>
</label>
<label class="flex-1 relative">
<input class="peer sr-only" name="tx_type" type="radio" value="penjualan"/>
<div class="w-full h-[44px] flex items-center justify-center border border-outline-variant rounded-DEFAULT font-label-md text-label-md cursor-pointer peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:border-primary transition-all">
                            Penjualan
                        </div>
</label>
</div>
</div>
<!-- 5. Transaction Date -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="date">Transaction Date <span class="text-error">*</span></label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">calendar_today</span>
<input class="w-full h-[44px] pl-10 pr-sm bg-surface border border-outline-variant rounded-DEFAULT font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-on-surface" id="date" type="date"/>
</div>
</div>
<!-- 4. Estimated Cost -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="cost">Estimated Cost</label>
<div class="relative flex items-center">
<div class="absolute left-0 top-0 bottom-0 flex items-center justify-center px-sm bg-surface-container-low border border-r-0 border-outline-variant rounded-l-DEFAULT font-label-md text-label-md text-on-surface-variant">
                        Rp
                    </div>
<input class="w-full h-[44px] pl-14 pr-sm bg-surface border border-outline-variant rounded-DEFAULT font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-on-surface placeholder:text-outline-variant text-right" id="cost" inputmode="numeric" placeholder="0" type="tel"/>
</div>
<p class="font-label-sm text-label-sm text-outline-variant text-right">Approximate initial quote</p>
</div>
</form>
</main>
<!-- Sticky Footer Action -->
<footer class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant px-margin-mobile py-sm z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<button class="w-full h-[44px] bg-secondary text-on-secondary font-label-md text-label-md font-bold rounded-DEFAULT flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-sm" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
            Simpan Transaksi
        </button>
</footer>
<script>
        // Simple numeric formatting for Rp input
        const costInput = document.getElementById('cost');
        costInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if(value) {
                e.target.value = new Intl.NumberFormat('id-ID').format(value);
            }
        });

        // Set default date to today
        document.getElementById('date').valueAsDate = new Date();
    </script>
</body></html>
