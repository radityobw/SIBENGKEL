<style>
        .input-float-container {
            position: relative;
            margin-bottom: 24px;
        }
        .input-float-container input {
            width: 100%;
            height: 56px;
            padding: 24px 16px 8px;
            background-color: transparent;
            border: 1px solid #E2E8F0;
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        .input-float-container input:focus {
            border-color: #022448;
        }
        .input-float-container label {
            position: absolute;
            left: 16px;
            top: 18px;
            pointer-events: none;
            transition: 0.2s ease all;
            color: #74777f;
            font-size: 16px;
        }
        .input-float-container input:focus ~ label,
        .input-float-container input:not(:placeholder-shown) ~ label {
            top: 8px;
            font-size: 12px;
            color: #022448;
            font-weight: 500;
        }
        .bg-pattern {
            background-image: radial-gradient(#E2E8F0 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col bg-pattern">
<!-- Top App Bar (Suppress Nav shell because this is a transactional page) -->
<header class="flex justify-between items-center w-full px-margin-mobile h-14 bg-surface border-b border-outline-variant flat no shadows fixed top-0 z-50">
<button aria-label="Kembali" class="text-primary active:scale-95 transition-transform flex items-center justify-center w-10 h-10 hover:bg-surface-container-low rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary text-center">SIBENGKEL</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-14 px-margin-mobile py-lg pb-xl flex flex-col justify-center items-center">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-md border border-outline-variant p-md relative overflow-hidden">
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-2 bg-secondary-container"></div>
<div class="text-center mb-lg pt-sm">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-xs">Buat Akun Baru</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Bergabunglah dan nikmati layanan bengkel terbaik dari genggaman Anda.</p>
</div>
<form action="#" class="w-full" method="POST">
<div class="input-float-container">
<input class="font-body-md text-body-md text-on-background" id="fullname" name="fullname" placeholder=" " required="" type="text"/>
<label class="font-label-md text-label-md" for="fullname">Nama Lengkap</label>
</div>
<div class="input-float-container">
<input class="font-body-md text-body-md text-on-background" id="phone" name="phone" placeholder=" " required="" type="tel"/>
<label class="font-label-md text-label-md" for="phone">Nomor Telepon</label>
</div>
<div class="input-float-container">
<input class="font-body-md text-body-md text-on-background" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="font-label-md text-label-md" for="email">Alamat Email</label>
</div>
<div class="input-float-container">
<input class="font-body-md text-body-md text-on-background pr-12" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="font-label-md text-label-md" for="password">Kata Sandi</label>
<button aria-label="Tampilkan sandi" class="absolute right-4 top-4 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<div class="input-float-container">
<input class="font-body-md text-body-md text-on-background pr-12" id="confirm_password" name="confirm_password" placeholder=" " required="" type="password"/>
<label class="font-label-md text-label-md" for="confirm_password">Konfirmasi Kata Sandi</label>
<button aria-label="Tampilkan sandi" class="absolute right-4 top-4 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<div class="flex items-start mb-lg mt-xs">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-outline rounded focus:ring-primary focus:ring-2" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="terms">Saya setuju dengan <a class="text-primary hover:underline font-semibold" href="#">Syarat &amp; Ketentuan</a> serta <a class="text-primary hover:underline font-semibold" href="#">Kebijakan Privasi</a>.</label>
</div>
</div>
<button class="w-full bg-secondary-container text-on-secondary-container hover:bg-secondary hover:text-on-secondary font-label-md text-label-md font-bold py-4 px-6 rounded-lg shadow-sm flex justify-center items-center gap-2 active:scale-95 transition-all duration-150 h-[44px]" type="submit">
                    Daftar Sekarang
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-lg text-center pb-sm border-t border-outline-variant pt-sm border-dashed">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Sudah punya akun? <br class="sm:hidden"/>
<a class="text-primary font-bold hover:underline mt-2 inline-block" href="#">Masuk di sini</a>
</p>
</div>
</div>
</main>
<script>
        // Simple toggle for password visibility
        document.querySelectorAll('button[aria-label="Tampilkan sandi"]').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling.previousElementSibling;
                const icon = this.querySelector('span');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                }
            });
        });
    </script>
</body></html>
