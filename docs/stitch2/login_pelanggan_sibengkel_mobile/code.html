<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SIBENGKEL - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Sora:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#f0f1f3",
                        "primary": "#022448",
                        "on-error": "#ffffff",
                        "surface-variant": "#e1e2e4",
                        "on-error-container": "#93000a",
                        "tertiary": "#002447",
                        "primary-fixed-dim": "#adc8f5",
                        "secondary-fixed-dim": "#ffb77d",
                        "on-secondary-fixed-variant": "#6e3900",
                        "on-tertiary-fixed-variant": "#004883",
                        "primary-container": "#1e3a5f",
                        "on-surface": "#191c1e",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#2e3132",
                        "surface-container-low": "#f2f4f6",
                        "secondary-container": "#ffa454",
                        "secondary": "#904d00",
                        "on-surface-variant": "#43474e",
                        "tertiary-fixed-dim": "#a4c9ff",
                        "surface-tint": "#455f87",
                        "primary-fixed": "#d5e3ff",
                        "secondary-fixed": "#ffdcc3",
                        "on-secondary-container": "#713b00",
                        "surface-bright": "#f8f9fb",
                        "outline-variant": "#c4c6cf",
                        "on-tertiary-fixed": "#001c39",
                        "error": "#ba1a1a",
                        "background": "#f8f9fb",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#191c1e",
                        "surface": "#f8f9fb",
                        "inverse-primary": "#adc8f5",
                        "on-primary-fixed": "#001c3b",
                        "tertiary-container": "#003a6c",
                        "tertiary-fixed": "#d4e3ff",
                        "outline": "#74777f",
                        "on-primary-fixed-variant": "#2d486d",
                        "surface-container-highest": "#e1e2e4",
                        "on-secondary-fixed": "#2f1500",
                        "surface-dim": "#d9dadc",
                        "on-tertiary-container": "#62a5f9",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#edeef0",
                        "on-primary-container": "#8aa4cf",
                        "surface-container-high": "#e7e8ea"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "xl": "48px",
                        "margin-mobile": "16px",
                        "xs": "8px",
                        "lg": "32px",
                        "sm": "16px",
                        "base": "4px",
                        "margin-desktop": "32px",
                        "gutter": "20px"
                    },
                    "fontFamily": {
                        "headline-md": ["Sora"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Sora"],
                        "headline-xl": ["Sora"],
                        "headline-lg-mobile": ["Sora"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],

                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .input-group:focus-within label {
            color: #022448; /* primary */
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:hidden selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Top Area: Logo & Welcome -->
<main class="flex-1 flex flex-col justify-center px-margin-mobile pt-xl pb-md">
<div class="mb-lg flex flex-col items-center text-center">
<div class="w-20 h-20 bg-surface-container-high rounded-2xl flex items-center justify-center mb-sm shadow-sm border border-outline-variant">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 1;">construction</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">SIBENGKEL</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Masuk ke akun Anda untuk melanjutkan</p>
</div>
<!-- Login Form -->
<div class="bg-surface-container-lowest p-md rounded-xl border border-outline-variant shadow-sm w-full max-w-sm mx-auto">
<form action="#" class="space-y-md" method="POST">
<!-- Email/Phone Input -->
<div class="input-group relative">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-base" for="identifier">Email atau Nomor Telepon</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">person</span>
<input class="w-full h-[44px] pl-10 pr-4 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-body-md text-body-md transition-colors placeholder:text-outline-variant" id="identifier" name="identifier" placeholder="Masukkan email atau no. hp" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="input-group relative">
<div class="flex justify-between items-center mb-base">
<label class="block font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Lupa Password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-[20px] pointer-events-none">lock</span>
<input class="w-full h-[44px] pl-10 pr-10 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-body-md text-body-md transition-colors placeholder:text-outline-variant" id="password" name="password" placeholder="Masukkan password" required="" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors flex items-center justify-center p-1 rounded-full focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[44px] bg-primary hover:bg-primary-container active:scale-[0.98] text-on-primary font-label-md text-label-md rounded-lg shadow-sm flex items-center justify-center transition-all mt-sm" type="submit">
                    Masuk
                </button>
</form>
</div>
<!-- Register Link -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Belum punya akun? 
                <a class="font-label-md text-label-md text-primary hover:underline underline-offset-4 decoration-primary/50" href="#">Daftar di sini</a>
</p>
</div>
</main>
<!-- Suppressed BottomNavBar & TopAppBar per shell relevance check (Transactional Screen) -->
</body></html>
