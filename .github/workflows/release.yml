name: Release & Package SIBENGKEL

on:
  push:
    tags:
      - "v*"
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag (e.g., v1.1.0) to attach release tarball, SHA256SUMS.txt, and tag GHCR image"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-and-release-assets:
    name: Test, Build Production Bundle & Upload Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify VERSION Matches Release Tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          PUSH_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          APP_VER="$(tr -d '[:space:]' < VERSION)"
          echo "APP_VER=$APP_VER" >> "$GITHUB_ENV"
          RAW_TAG="${EVENT_TAG:-${PUSH_TAG:-$DISPATCH_TAG}}"
          echo "RELEASE_TAG=$RAW_TAG" >> "$GITHUB_ENV"
          if [ -n "$RAW_TAG" ]; then
            TAG_VER="${RAW_TAG#v}"
            if [ "$APP_VER" != "$TAG_VER" ]; then
              echo "VERSION ($APP_VER) does not match tag ($TAG_VER)" >&2
              exit 1
            fi
          fi

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, intl, gd
          tools: composer

      - name: Prepare Environment & Install Full Dependencies for Tests
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate --no-interaction

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Run Full Test Suite
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

      - name: Install Production-Only PHP Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Package Production Tarball & Checksums
        run: |
          mkdir -p build-release
          TAR_NAME="sibengkel-${APP_VER}.tar.gz"
          tar -czf "build-release/${TAR_NAME}" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='docs/stitch' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='build-release' \
            --exclude='_site' \
            .
          (cd build-release && sha256sum "${TAR_NAME}" > SHA256SUMS.txt)

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sibengkel-release
          path: build-release/

      - name: Create or Update GitHub Release & Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release create "$RELEASE_TAG" --title "SIBENGKEL ${RELEASE_TAG}" --generate-notes
            fi
            gh release upload "$RELEASE_TAG" build-release/*.tar.gz build-release/SHA256SUMS.txt --clobber
          else
            echo "No release_tag specified on workflow_dispatch; skipping GitHub Release publish."
          fi

  publish-ghcr:
    name: Build & Push Container to ghcr.io
    needs: build-and-release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Image Tags
        id: meta
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          PUSH_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
          SHA_VAL: ${{ github.sha }}
        run: |
          RAW_TAG="${EVENT_TAG:-${PUSH_TAG:-$DISPATCH_TAG}}"
          SHORT_SHA="${SHA_VAL:0:7}"
          TAGS="ghcr.io/radityobw/sibengkel:latest,ghcr.io/radityobw/sibengkel:sha-${SHORT_SHA}"
          if [ -n "$RAW_TAG" ]; then
            CLEAN_VER="${RAW_TAG#v}"
            TAGS="${TAGS},ghcr.io/radityobw/sibengkel:${CLEAN_VER}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/radityobw/SIBENGKEL
            org.opencontainers.image.licenses=MIT
