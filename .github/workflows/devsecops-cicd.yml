name: DevSecOps CI/CD Pipeline SIBENGKEL

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-and-linting:
    name: DevSecOps Audit & SAST/SCA Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SIDIK Security Scanner
        run: |
          python -m pip install --upgrade pip
          pip install "sidik>=1.4.0,<2.0.0" || pip install "git+https://github.com/radityobw/SIDIK.git@main"

      - name: Run SIDIK SAST & SCA Scan
        run: |
          sidik --target . --mode all --format github --sarif-output sidik-results.sarif --fail-on high --lang en --quiet

      - name: Upload SIDIK SARIF Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidik-sarif-report
          path: sidik-results.sarif

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Validate Composer Manifest & Lock
        run: composer validate --strict --no-interaction

      - name: Composer Audit Security Check
        run: composer audit --locked --no-interaction

  automated-testing:
    name: Automated Unit & Feature Testing (PHP ${{ matrix.php }})
    needs: security-and-linting
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.4" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, intl, gd
          tools: composer

      - name: Copy .env for Testing
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Generate Application Key
        run: php artisan key:generate --no-interaction

      - name: Execute Tests (PHPUnit)
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test
